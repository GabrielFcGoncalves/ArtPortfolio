services:

  iam:
    build:
      context: ./keycloak
      dockerfile: Dockerfile
    command: start-dev --import-realm 
    container_name: iam
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_IMPORT: /opt/keycloak/data/import/
      KC_HTTP_ACCESS_LOG_ENABLED: "false"
      KC_LOG_LEVEL: info,spi:debug
      KC_SPI_USER_PROVIDER_JPA_CASE_SENSITIVE: "true"
      KC_HTTP_ENABLED: true
      KC_HOSTNAME: ${KC_HOSTNAME}
      KC_DB: postgres
      KC_DB_URL: ${KC_DB_URL}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_CLIENT_SECRET: ${KC_CLIENT_SECRET}
      KC_FRONTEND_URL: ${KC_FRONTEND_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      KC_BACKEND_URL: ${KC_BACKEND_URL}
      JAVA_OPTS_APPEND: "-Dkeycloak.migration.strategy=IGNORE_EXISTING"
      KC_DB_POOL_INITIAL_SIZE: 5
      KC_DB_POOL_MAX_SIZE: 10
      SPRING_SERVICE_BUS_CONNECTION_STRING: ${SPRING_SERVICE_BUS_CONNECTION_STRING}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}

    ports:
      - "8081:8080"

    depends_on:
      db-relational:
        condition: service_healthy

    volumes:
      - artist_keycloak_data:/opt/keycloak/data
      - ./keycloak/imports:/opt/keycloak/data/import:ro

    networks:
      - artist-net


  # --- 7. BACKEND API (Spring Boot) ---
  api:
    build: 
      context: ../Art
      dockerfile: Dockerfile
    container_name: artist_os_api
    depends_on:
      - db-relational
      - db-nosql
      - cache
      - iam
      - localstack
      - rabbitmq
    ports:
      - "8080:8080"
    volumes:
      - ../Art:/app
      - /app/target
      - /app/.mvn
    environment:
      # Database Connections
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://db-relational:5432/platform}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-postgres}
      SPRING_DATA_MONGODB_URI: ${SPRING_DATA_MONGODB_URI}
      SPRING_REDIS_HOST: ${SPRING_REDIS_HOST:-cache}
      
      # Security / IAM
      SPRING_KC_ISSUER_URI: ${SPRING_KC_ISSUER_URI}
      SPRING_KC_JWK_URI: ${SPRING_KC_JWK_URI}
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      
      # Azure Mock Connection (Standard Azurite Connection String)
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azure-mock:10000/devstoreaccount1;}
      
      # External Integrations
      STRIPE_API_KEY: ${STRIPE_API_KEY}
      SPRING_SERVICE_BUS_CONNECTION_STRING: ${SPRING_SERVICE_BUS_CONNECTION_STRING}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT}
      AWS_S3_URL_BASE: ${AWS_S3_URL_BASE}
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY}
    extra_hosts:
      - "localhost:host-gateway"
    networks:
      - artist-net


  db-relational:
    image: postgres:15-alpine
    container_name: artist_os_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - artist_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - artist-net

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5


  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: artist_os_frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_IAM_URL: ${NEXT_PUBLIC_IAM_URL}
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - artist-net


  # --- 3. NON-RELATIONAL DATA (MongoDB) ---
  db-nosql:
    image: mongo:latest
    container_name: artist_os_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    networks:
      - artist-net

  # --- 4. CACHE LAYER (Redis) ---
  cache:
    image: redis:alpine
    container_name: artist_os_redis
    networks:
      - artist-net

  # --- 5. AWS CLOUD MOCK (LocalStack) ---
  localstack:
    image: localstack/localstack:latest
    container_name: artist_os_localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN}
      - EXTRA_CORS_ALLOWED_ORIGINS=*
      - DISABLE_CORS_CHECKS=1
    volumes:
      - localstack_data:/var/lib/localstack
      - ./infra/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh
    networks:
      - artist-net

  # --- 9. LOCAL MESSAGE BROKER (RabbitMQ) ---
  rabbitmq:
    image: rabbitmq:3-management
    container_name: artist_os_rabbitmq
    ports:
      - "5672:5672" 
      - "15672:15672" 
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json
    

    command: >
      sh -c "rabbitmq-plugins enable rabbitmq_amqp1_0 && rabbitmq-server"
    networks:
      - artist-net




networks:
  artist-net:
    driver: bridge

volumes:
  artist_keycloak_data:
  artist_pgdata:
  mongodata:
  localstack_data:
