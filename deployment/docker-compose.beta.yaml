services:

  iam:
    build:
      context: ../keycloak
      dockerfile: Dockerfile
    command: start-dev --import-realm 
    container_name: iam
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_IMPORT: /opt/keycloak/data/import/
      KC_HTTP_ACCESS_LOG_ENABLED: "true"
      KC_LOG_CATEGORY_ORG_KEYCLOAK_AUTHORIZATION: DEBUG
      KC_LOG_LEVEL: DEBUG
      KC_SPI_USER_PROVIDER_JPA_CASE_SENSITIVE: "true"
      KC_HTTP_ENABLED: true
      KC_HOSTNAME: ${KC_HOSTNAME}
      KC_DB: postgres
      KC_DB_URL: ${KC_DB_URL}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_CLIENT_SECRET: ${KC_CLIENT_SECRET}
      KC_FRONTEND_URL: ${KC_FRONTEND_URL}
      KC_BACKEND_URL: ${KC_BACKEND_URL}
      JAVA_OPTS_APPEND: "-Dkeycloak.migration.strategy=IGNORE_EXISTING"
      KC_DB_POOL_INITIAL_SIZE: 5
      KC_DB_POOL_MAX_SIZE: 10

    ports:
      - "8081:8080"

    depends_on:
      db-relational:
        condition: service_healthy

    volumes:
      - artist_keycloak_data:/opt/keycloak/data
      - ../keycloak/imports:/opt/keycloak/data/import:ro

    networks:
      - artist-net


  # --- 7. BACKEND API (Spring Boot) ---
  api:
    build: 
      context: ../Art
      dockerfile: Dockerfile
    container_name: artist_os_api
    depends_on:
      - db-relational
      - db-nosql
      - cache
      - iam
      - azure-mock
    ports:
      - "8080:8080"
    volumes:
      - ../Art:/app
      - /app/target
      - /app/.mvn
    environment:
      # Database Connections
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://db-relational:5432/platform}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-postgres}
      SPRING_DATA_MONGODB_URI: ${SPRING_DATA_MONGODB_URI:-mongodb://db-nosql:27017/portfolio}
      SPRING_REDIS_HOST: ${SPRING_REDIS_HOST:-cache}
      
      # Security / IAM
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${KC_ISSUER_URI:-http://iam:8080/realms/platform}
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
      
      # Azure Mock Connection (Standard Azurite Connection String)
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azure-mock:10000/devstoreaccount1;}
      
      # External Integrations
      STRIPE_API_KEY: ${STRIPE_API_KEY}
    networks:
      - artist-net


  db-relational:
    image: postgres:15-alpine
    container_name: artist_os_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - artist_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - artist-net

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5


  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: artist_os_frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_IAM_URL: ${NEXT_PUBLIC_IAM_URL}
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - artist-net


  # --- 3. NON-RELATIONAL DATA (MongoDB) ---
  db-nosql:
    image: mongo:latest
    container_name: artist_os_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    networks:
      - artist-net

  # --- 4. CACHE LAYER (Redis) ---
  cache:
    image: redis:alpine
    container_name: artist_os_redis
    networks:
      - artist-net

  # --- 5. AZURE CLOUD MOCK (Azurite) ---
  azure-mock:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
    container_name: artist_os_azurite
    ports:
      - "10000:10000" # Blob
      - "10001:10001" # Queue
    volumes:
      - azurite_data:/data
    networks:
      - artist-net




networks:
  artist-net:
    driver: bridge

volumes:
  artist_keycloak_data:
  artist_pgdata:
  mongodata:
  azurite_data:
