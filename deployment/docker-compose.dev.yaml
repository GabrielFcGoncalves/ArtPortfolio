  # --- 8. FRONTEND (Next.js) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: artist_os_frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_IAM_URL: ${NEXT_PUBLIC_IAM_URL}
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - artist-net

