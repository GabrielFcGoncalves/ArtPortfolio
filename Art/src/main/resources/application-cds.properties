# Keep autoconfigurations lazy to avoid connection attempts
spring.main.lazy-initialization=true

# Bypass HikariCP startup check
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.url=jdbc:postgresql://localhost:5432/unused

# Exclude all Mongo and JDBC autoconfigurations (which try to reach out or resolve dialects)
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,\
  org.springframework.boot.mongo.autoconfigure.MongoAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration,\
  org.springframework.boot.mongo.autoconfigure.MongoDataAutoConfiguration,\
  org.springframework.boot.mongo.autoconfigure.MongoRepositoriesAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.jdbc.JdbcRepositoriesAutoConfiguration,\
  org.springframework.boot.data.jdbc.autoconfigure.DataJdbcRepositoriesAutoConfiguration,\
  org.springframework.boot.data.jdbc.autoconfigure.JdbcRepositoriesAutoConfiguration,\
  org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration,\
  com.azure.spring.cloud.autoconfigure.servicebus.AzureServiceBusAutoConfiguration,\
  com.azure.spring.cloud.autoconfigure.servicebus.AzureServiceBusMessagingAutoConfiguration

# Disable repositories and connectivity checks
spring.mongodb.repositories.enabled=false
spring.data.mongodb.repositories.enabled=false
spring.data.mongodb.repositories.type=none
spring.data.jpa.repositories.enabled=true


# Disable DDL and SQL init
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never

# Dummy keys to satisfy placeholders in application.properties
# These are only used during the CDS training run in Docker build.
SPRING_DATA_MONGODB_URI=mongodb://localhost:27017/unused
SPRING_SERVICE_BUS_CONNECTION_STRING=Endpoint=sb://unused.servicebus.windows.net/;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=unused
AZURE_SERVICE_BUS_CONNECTION_STRING=Endpoint=sb://unused.servicebus.windows.net/;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=unused
SPRING_KC_JWK_URI=http://localhost:8080/realms/unused/protocol/openid-connect/certs
SPRING_KC_ISSUER_URI=http://localhost:8080/realms/unused

POSTGRES_DB=unused
POSTGRES_USER=unused
POSTGRES_PASSWORD=unused
RABBITMQ_HOST=localhost
RABBITMQ_PORT=5672
RABBITMQ_USERNAME=unused
RABBITMQ_PASSWORD=unused
CORS_ALLOWED_ORIGINS=http://localhost:3000
AWS_REGION=us-east-1
AWS_S3_BUCKET=unused
AWS_S3_ENDPOINT=http://localhost:4566
AWS_S3_URL_BASE=http://localhost:4566/unused
AWS_ACCESS_KEY=unused
AWS_SECRET_KEY=unused
IMGPROXY_URL=http://localhost:8082

# Override properties directly to be safe
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/unused
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/unused/protocol/openid-connect/certs
spring.data.mongodb.uri=mongodb://localhost:27017/unused
spring.mongodb.uri=mongodb://localhost:27017/unused
spring.cloud.azure.servicebus.connection-string=Endpoint=sb://unused.servicebus.windows.net/;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=unused
azure.service-bus.connection-string=Endpoint=sb://unused.servicebus.windows.net/;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=unused



