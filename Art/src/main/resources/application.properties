spring.application.name=Art

#Postgres
spring.datasource.url=jdbc:postgresql://db-relational:5432/${POSTGRES_DB:platform}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
#TODO REMOVE IN PROD
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#Mongo
spring.mongodb.uri=${SPRING_DATA_MONGODB_URI}
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}

#Keycloak OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SPRING_KC_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SPRING_KC_JWK_URI}

#CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}


# Azure Service Bus
spring.cloud.azure.servicebus.connection-string=${SPRING_SERVICE_BUS_CONNECTION_STRING}
azure.service-bus.connection-string=${SPRING_SERVICE_BUS_CONNECTION_STRING}

# Message Broker Toggle
message.broker=${MESSAGE_BROKER:servicebus}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

spring.jpa.open-in-view=false
