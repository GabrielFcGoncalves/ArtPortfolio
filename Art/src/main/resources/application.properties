spring.application.name=Art

#Postgres
spring.datasource.url=jdbc:postgresql://db-relational:5432/${POSTGRES_DB:platform}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
#TODO REMOVE IN PROD
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#Mongo
spring.data.mongodb.uri=mongodb://db-nosql:27017/${MONGO_DB:portfolio}

#Keycloak OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KC_ISSUER_URI:http://localhost:8081/realms/platform}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KC_JWK_URI:http://localhost:8081/realms/platform/protocol/openid-connect/certs}

#CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
