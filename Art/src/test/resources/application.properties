# This overrides the Postgres settings during mvn package
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Mock Security to allow context load tests on host
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/platform
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/platform/protocol/openid-connect/certs

# Mock MongoDB, Azure Service Bus, RabbitMQ, AWS, and CORS properties
spring.data.mongodb.uri=mongodb://localhost:27017/testdb
spring.mongodb.uri=mongodb://localhost:27017/testdb
spring.cloud.azure.servicebus.connection-string=Endpoint=sb://test.servicebus.windows.net/;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=test
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
app.cors.allowed-origins=http://localhost:3000
aws.region=us-east-1
aws.credentials.access-key=dummy
aws.credentials.secret-key=dummy
aws.s3.bucket=dummy-bucket
aws.s3.endpoint=http://localhost:4566
aws.s3.url-base=http://localhost:4566/dummy-bucket
imgproxy.url=http://localhost:8080