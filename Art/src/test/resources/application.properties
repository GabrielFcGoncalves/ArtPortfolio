# This overrides the Postgres settings during mvn package
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Mock Security to allow context load tests on host
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/platform
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/platform/protocol/openid-connect/certs